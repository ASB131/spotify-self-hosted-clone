name: Build Android APK

on:
  push:
    tags: ["v*"]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform scaffolding
        run: |
          flutter create --platforms=android --org=com.mixplayer --project-name=mix_player .
          # Preserve our Dart sources / pubspec (flutter create does not overwrite lib/).

      - name: Allow cleartext HTTP + network security
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <base-config cleartextTrafficPermitted="false">
              <trust-anchors>
                <certificates src="system" />
                <certificates src="user" />
              </trust-anchors>
            </base-config>
            <!-- LAN / self-hosted HTTP APIs -->
            <domain-config cleartextTrafficPermitted="true">
              <domain includeSubdomains="true">localhost</domain>
              <domain includeSubdomains="true">10.0.0.0</domain>
              <domain includeSubdomains="true">192.168.0.0</domain>
              <domain includeSubdomains="true">172.16.0.0</domain>
            </domain-config>
          </network-security-config>
          XML
          # Android domain-config doesn't support CIDR; allow cleartext globally for self-host flexibility
          # while still trusting system CAs for HTTPS public domains.
          cat > android/app/src/main/res/xml/network_security_config.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <base-config cleartextTrafficPermitted="true">
              <trust-anchors>
                <certificates src="system" />
                <certificates src="user" />
              </trust-anchors>
            </base-config>
          </network-security-config>
          XML
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml\/network_security_config"/' "$MANIFEST"
          elif ! grep -q 'networkSecurityConfig' "$MANIFEST"; then
            sed -i 's/usesCleartextTraffic="true"/usesCleartextTraffic="true" android:networkSecurityConfig="@xml\/network_security_config"/' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '0,/<manifest /s//<manifest /\n    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n/' "$MANIFEST" || true
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle.kts || true
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle || true
            sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle || true
          fi
          echo "--- manifest ---"
          head -40 "$MANIFEST"

      - name: Pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/mix-player.apk
          ls -lh dist/mix-player.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mix-player-apk
          path: mobile/dist/mix-player.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/dist/mix-player.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
