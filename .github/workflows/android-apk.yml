name: Build Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform scaffolding
        run: |
          flutter create --platforms=android --org=com.mixplayer --project-name=mix_player .
          # Preserve our Dart sources / pubspec (flutter create does not overwrite lib/).

          # Release source-set merge (debug already has INTERNET; release does not).
          mkdir -p android/app/src/release
          cp tooling/release-AndroidManifest.xml android/app/src/release/AndroidManifest.xml

      - name: Allow network + cleartext HTTP for self-hosted servers
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          mkdir -p android/app/src/main/res/xml

          # Flutter release manifests intentionally omit INTERNET (debug/profile only).
          # Without this, the APK cannot open any sockets — browsers still work on the same phone.
          python3 <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          if "android.permission.INTERNET" not in text:
              needle = "<manifest"
              idx = text.find(needle)
              if idx < 0:
                  raise SystemExit("AndroidManifest.xml missing <manifest>")
              # Insert permissions immediately after the opening <manifest ...> tag.
              gt = text.find(">", idx)
              if gt < 0:
                  raise SystemExit("AndroidManifest.xml malformed")
              insert = (
                  '>\n    <uses-permission android:name="android.permission.INTERNET"/>\n'
                  '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>'
              )
              text = text[:gt] + insert + text[gt + 1:]

          # Allow http:// LAN API hosts + attach network security config.
          if "usesCleartextTraffic" not in text:
              text = text.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true" '
                  'android:networkSecurityConfig="@xml/network_security_config"',
                  1,
              )
          elif "networkSecurityConfig" not in text:
              text = text.replace(
                  'usesCleartextTraffic="true"',
                  'usesCleartextTraffic="true" '
                  'android:networkSecurityConfig="@xml/network_security_config"',
                  1,
              )

          manifest.write_text(text, encoding="utf-8")
          print("--- manifest (head) ---")
          print("\n".join(text.splitlines()[:45]))
          if "android.permission.INTERNET" not in text:
              raise SystemExit("FATAL: INTERNET permission still missing")
          PY

          cat > android/app/src/main/res/xml/network_security_config.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <base-config cleartextTrafficPermitted="true">
              <trust-anchors>
                <certificates src="system" />
                <certificates src="user" />
              </trust-anchors>
            </base-config>
          </network-security-config>
          XML
          # Strip accidental leading spaces from the heredoc body (YAML indent).
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/res/xml/network_security_config.xml")
          lines = p.read_text(encoding="utf-8").splitlines()
          # Drop common leading whitespace from non-empty lines while preserving relative indent.
          nonempty = [ln for ln in lines if ln.strip()]
          if not nonempty:
              raise SystemExit("empty network_security_config")
          # Find minimum indent of non-empty lines
          def lead(s):
              return len(s) - len(s.lstrip(" "))
          m = min(lead(ln) for ln in nonempty)
          fixed = "\n".join(ln[m:] if ln.strip() else "" for ln in lines).strip() + "\n"
          p.write_text(fixed, encoding="utf-8")
          print(fixed)
          PY

          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle.kts || true
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle || true
            sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle || true
          fi

      - name: Pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/mix-player.apk
          ls -lh dist/mix-player.apk

      - name: Verify INTERNET permission in APK
        run: |
          set -euo pipefail
          python3 <<'PY'
          import zipfile
          from pathlib import Path

          apk = Path("dist/mix-player.apk")
          with zipfile.ZipFile(apk) as z:
              manifest = z.read("AndroidManifest.xml")

          # Decompressed AXML string pool may be UTF-8 or UTF-16LE.
          ascii_ok = b"android.permission.INTERNET" in manifest
          utf16_ok = "android.permission.INTERNET".encode("utf-16le") in manifest
          # Also accept resource-name fragment used by some toolchains.
          frag_ok = b"INTERNET" in manifest or "INTERNET".encode("utf-16le") in manifest

          print(f"manifest_bytes={len(manifest)} ascii={ascii_ok} utf16={utf16_ok} frag={frag_ok}")
          if not (ascii_ok or utf16_ok or frag_ok):
              # Dump a hex preview to aid debugging.
              print(manifest[:64].hex())
              raise SystemExit("FATAL: built APK AndroidManifest.xml missing INTERNET")
          print("OK: INTERNET permission present in APK")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mix-player-apk
          path: mobile/dist/mix-player.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/dist/mix-player.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
