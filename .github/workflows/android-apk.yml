name: Build Android APK

on:
  push:
    tags: ["v*"]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform scaffolding
        run: |
          flutter create --platforms=android --org=com.mixplayer --project-name=mix_player .
          # Preserve our Dart sources / pubspec (flutter create does not overwrite lib/).

      - name: Allow cleartext HTTP (LAN servers)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi
          # Ensure INTERNET permission
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's|<manifest |<manifest |\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n|' "$MANIFEST" || true
          fi
          # minSdk for just_audio
          sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle || true
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle || true
          # Newer AGP uses build.gradle.kts
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle.kts || true
          fi

      - name: Pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/mix-player.apk
          ls -lh dist/mix-player.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mix-player-apk
          path: mobile/dist/mix-player.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/dist/mix-player.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
